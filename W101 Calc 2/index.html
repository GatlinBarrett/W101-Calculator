<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W101 Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1 class="title">Welcome, to the Spiral!</h1>

    <div class="calculatorContainer">
        <button class="profile">
            <a href="PFSelect.html">Profiles</a>
        </button>:
        <div class="profileName"></div>
        <div class="inputContainer">
            <div class="inputWidth">
                <span class="baseSpellDamage">Base Spell Damage: <br><input type="number" id="baseDamageInput"
                        value="0"><br></span>
            </div>
            <div class="inputWidth">
                <span class="enchant">Enchant: <br><input type="number" id="enchantInput" value="0"><br></span>
            </div>
            <div class="inputWidth">
                <span class="basePercentDamage">Base Damage Percent: <br><input type="number" id="damagePercentInput"
                        value="0">%<br></span>
            </div>
            <div class="inputWidth">
                <span class="pierce">Pierce: <br><input type="number" id="pierceInput" value="0">%<br></span>
            </div>
            <div class="inputWidth">
                <div class="allowed">
                    <span class="inputWidth">Traps Allowed? <input type="checkbox" id="trapsInput"
                            onchange="toggleTraps()" checked></span>
                    <span class="inputWidth">Blades Allowed? <input type="checkbox" id="bladesInput"
                            onchange="toggleBlades()" checked></span>
                </div>
            </div>
        </div>

        <div class="chooseModifier">
            <div id="chooseBlade" class="chooseBlade" style="display: block;">
                Choose a Blade:
                <button onclick="newBlade()">New Blade</button>

                <div class="bladeContainer" id="bladeContainer" style="display: none;">
                    <span>Blade Percent: <input type="number" id="bladePercentInput" value="0">%<br></span>
                    <span>Max Blade Amount: <input type="number" id="bladeAmountInput" value="0"><br></span>
                    <button onclick="addBlade()">Add Blade</button>
                    <button onclick="cancelBlade()">Close</button>
                </div>
                <div id="bladeList"></div>
            </div><br>


            <div id="chooseTrap" class="chooseTrap" style="display: block;">
                Choose a Trap:
                <button onclick="newTrap()">New Trap</button>

                <div class="trapContainer" id="trapContainer" style="display: none;">
                    <span>Trap Percent: <input type="number" id="trapPercentInput" value="0">%<br></span>
                    <span>Max Trap Amount: <input type="number" id="trapAmountInput" value="0"><br></span>
                    <button onclick="addTrap()">Add Trap</button>
                    <button onclick="cancelTrap()">Close</button>
                </div>
                <div id="trapList"></div>
            </div>
        </div><br>



        <div class="enemyContainer">
            <span>Enemy Health: <input type="number" id="healthInput" value="0">HP<br></span>
            <span>Enemy Resist: <input type="number" id="resistInput" value="0">%<br></span><br>
        </div>

        <button onclick="calculateDamage()">Calculate</button>
        <div id="percentUsed"></div>
        <div id="totalDamage"></div>
        <div id="bladeDamageOnly"></div>
    </div>




</body>

</html>
