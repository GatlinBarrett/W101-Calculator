<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>W101 Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>WELCOME TO THE SPIRAL</h1>

    <span>Base Spell Damage: <input type="number" id="baseDamageInput" value="0"><br></span>
    <span>Base Damage Percent: <input type="number" id="damagePercentInput" value="0">%<br></span>
    <span>Pierce: <input type="number" id="pierceInput" value="0">%<br></span>
    Traps Allowed? <input type="checkbox" id="trapsInput" checked><br>
    Blades Allowed? <input type="checkbox" id="bladesInput" checked><br><br>

    Choose a Blade:
    <button onclick="newBlade()">New Blade</button><br>

    <div id="bladeContainer" style="display: none;">
        <span>Blade Percent: <input type="number" id="bladePercentInput" value="0">%<br></span>
        <span>Max Blade Amount: <input type="number" id="bladeAmountInput" value="0"><br></span>
        <button onclick="addBlade()">Add Blade</button>
        <button onclick="cancelBlade()">Cancel</button>
        <div id="bladeList"></div>
    </div><br>

    Choose a Trap:
    <button onclick="newTrap()">New Trap</button><br>

    <div id="trapContainer" style="display: none;">
        <span>Trap Percent: <input type="number" id="trapPercentInput" value="0">%<br></span>
        <span>Max Trap Amount: <input type="number" id="trapAmountInput" value="0"><br></span>
        <button onclick="addTrap()">Add Trap</button>
        <div id="trapList"></div>
        <button onclick="removeTrap()">Remove Trap</button><br>
    </div><br>

    <span>Enemy Health: <input type="number" id="healthInput" value="0"><br></span>
    <span>Enemy Resist: <input type="number" id="resistInput" value="0">%<br></span><br>


    <button onclick="calculateDamage()">Calculate</button>





</body>

</html>
